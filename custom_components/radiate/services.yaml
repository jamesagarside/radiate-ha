boost_store:
  fields:
    minutes:
      default: 60
      selector:
        number:
          min: 0
          max: 180
          unit_of_measurement: min
set_mode:
  fields:
    mode:
      required: true
      selector:
        select:
          options:
            - auto
            - frost
            - "off"
set_override:
  target:
    entity:
      integration: radiate
      domain: climate
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 5
          max: 28
          step: 0.5
          unit_of_measurement: "°C"
    until:
      selector:
        select:
          translation_key: override_until
          options:
            - next_change
            - duration
            - cleared
    duration_min:
      selector:
        number:
          min: 1
          max: 10080
          unit_of_measurement: min
clear_override:
  target:
    entity:
      integration: radiate
      domain: climate
set_away:
  fields:
    person:
      required: true
      example: early_riser
      selector:
        text:
    until:
      required: true
      selector:
        datetime:
clear_away:
  fields:
    person:
      required: true
      example: early_riser
      selector:
        text:
